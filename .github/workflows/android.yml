name: Android CI

# 푸시할 때마다 테스트를 돌리고 설치해 볼 수 있는 디버그 APK를 만든다.
on:
  push:
    branches: [ "main", "moa" ]
    paths-ignore: [ "server/**", "docs/**", "**.md" ]
  pull_request:
    branches: [ "main", "moa" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # moa 브랜치 빌드는 'moa-latest' 릴리스에 APK를 올린다(로그인 없이 폰에서 바로 받는 고정 링크).
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build web app
      run: npm run build:web
      env:
        # 저장소 Settings → Variables에 넣은 AI 서버 주소. 없으면 AI 해석 없이 빌드된다.
        VITE_MOA_API: ${{ vars.VITE_MOA_API }}

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build debug APK
      working-directory: android
      run: chmod +x gradlew && ./gradlew assembleDebug
      env:
        MOA_VERSION_CODE: ${{ github.run_number }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK (fixed download link)
      if: github.event_name == 'push' && github.ref == 'refs/heads/moa'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk MOA.apk
        VERSION=$(node -p "require('./package.json').version")
        gh release view moa-latest >/dev/null 2>&1 || gh release create moa-latest --title "MOA 최신" --notes "moa 브랜치 최신 빌드" --prerelease --target moa
        gh release upload moa-latest MOA.apk --clobber
        gh release edit moa-latest --title "MOA 최신 ($VERSION)" --notes "버전 $VERSION · 빌드 #${{ github.run_number }} · ${GITHUB_SHA::7}. 받기: https://github.com/${{ github.repository }}/releases/download/moa-latest/MOA.apk"
