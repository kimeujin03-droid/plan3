name: Deploy API

# server/ 의 Cloudflare Worker를 배포한다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY (등록법은 docs/server.md)
on:
  push:
    branches: [ "main", "moa" ]
    paths: [ "server/**", ".github/workflows/server.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4

    - name: Skip when Cloudflare is not connected yet
      if: env.CF_TOKEN == ''
      run: echo "::notice::CLOUDFLARE_API_TOKEN이 없어 배포를 건너뜁니다. docs/server.md를 따라 Secrets를 등록하세요."

    - name: Deploy worker
      if: env.CF_TOKEN != ''
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: server
        wranglerVersion: "4.162.0"
        command: deploy
        secrets: |
          GEMINI_API_KEY
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # 배포한 서버가 실제로 대답하는지 한 번 물어본다. 실패해도 배포 자체는 성공으로 둔다.
    - name: Smoke test
      if: env.CF_TOKEN != ''
      continue-on-error: true
      run: |
        URL=https://moa-api.kimeujin03.workers.dev
        sleep 5
        echo "health: $(curl -sS -m 20 $URL/health)"
        ask() { echo "$1 => $(curl -sS -m 30 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/parse -H 'content-type: application/json' -d "{\"text\":\"$1\",\"activities\":[\"공부\",\"과제\",\"이동\",\"알바\"],\"running\":[],\"now\":\"$2\",\"today\":\"$3\"}")"; }
        ask "도서관 가는 길인데 좀 졸려" "14:05" "2026-11-16 월"
        ask "다음주 화요일 3시에 교수님 면담 잡혔어" "14:05" "2026-11-16 월"
        ask "금요일 6시까지 레포트 내야 돼" "14:05" "2026-11-16 월"
        ask "오늘 다음 화요일 통계수학4 소테스트 있어서..한 3시간만 공부 하자" "16:28" "2026-11-20 금"
        ask "아니 오늘 통계수학 공부 3시간 한다고" "16:28" "2026-11-20 금"
        ask "내일 11시부터 2시까지 민아과외 온라인으로 하고 그러려고 10시반까지 이동" "19:05" "2026-11-20 금"
        ask "11/26 16:00-17:00 한성여고 교봉" "01:12" "2026-11-23 월"
        echo "fix => $(curl -sS -m 30 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/parse -H 'content-type: application/json' -d '{"text":"13시부터야","activities":["공부","과제"],"running":["공부"],"now":"16:30","today":"2026-11-20 금","prev":{"text":"공부 시작","at":"08:02","reply":"공부 시작! 08:02부터 적을게."}}')"
        ask "주말 안에 빨래 돌려야 되는데" "14:05" "2026-11-16 월"
        ask "내일 아침 9시에 일어날거여" "01:16" "2026-11-17 화"
        ask "내일 공부를 2시간 해볼까" "01:16" "2026-11-17 화"
        echo "steps => $(curl -sS -m 30 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/steps -H 'content-type: application/json' -d '{"text":"수치해석 레포트 쓰기"}')"


        cat > /tmp/week.json <<'JSON'
        {"text":"이게 내 이번주 일정이거든?? 우선 내일은 글쓰기와 초잉 사이 빈 시간에는 화정이 과외 자료 제작 마무리와 카카오 명의변경 신청 등 자잘한 업무들을 처리할거고, 강의계획서나 자료들 폴더를 정리할거야. 그리고 월요일에데과인 수업이랑 민아 과외가 겹쳐있는데, 이건 데과인이 온라인 수업이라 집에서 하게 되면 큰 문제는 없어. 그리고 이번주에 있는 미적분수업들을 어느정도 따라가야 하니까 틈틈히 미적분 공부도 해야해. 이건 수업마다 복습 최소 2시간은 필요해.(적어도 5-6시간은 확보해야해.) 그리고 학술제 소주제를 선정해야하기때문에 관련 자료조사도 필요해. 이건 한3-4시간 정도는 필요할거 같아. 이것들 포함해서 일정 한번 짜줄래??",
         "days":["2026-11-18 수","2026-11-19 목","2026-11-20 금","2026-11-21 토","2026-11-22 일","2026-11-23 월","2026-11-24 화"],
         "events":[{"date":"2026-11-19","start":"10:00","end":"11:30","text":"기초미적분학"},{"date":"2026-11-19","start":"13:00","end":"15:00","text":"글쓰기"},{"date":"2026-11-19","start":"18:00","end":"20:00","text":"초잉 과외"},{"date":"2026-11-23","start":"10:00","end":"11:30","text":"기초미적분학"},{"date":"2026-11-23","start":"13:00","end":"15:00","text":"데과인"},{"date":"2026-11-23","start":"14:00","end":"16:00","text":"민아 과외"}],
         "activities":["공부","과제","알바"]}
        JSON
        echo "week => $(curl -sS -m 40 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/week -H 'content-type: application/json' --data-binary @/tmp/week.json)"
        cat > /tmp/fixed.json <<'JSON'
        {"text":"월 10:00-11:30 기초미적분학 (공학관 301)\n목 10:00-11:30 기초미적분학 (공학관 301)\n화 13:00-15:00 글쓰기\n매주 토요일 2시~6시 카페 알바, 12월 19일까지\n공부는 밤 9시 이후에 집중 잘 돼\n12월 8일부터 19일까지 기말고사",
         "days":["2026-11-18 수","2026-11-19 목","2026-11-20 금","2026-11-21 토","2026-11-22 일","2026-11-23 월","2026-11-24 화"],"events":[],"activities":["공부","알바"]}
        JSON
        echo "fixed => $(curl -sS -m 40 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/week -H 'content-type: application/json' --data-binary @/tmp/fixed.json)"
