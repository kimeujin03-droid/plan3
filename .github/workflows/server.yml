name: Deploy API

# server/ 의 Cloudflare Worker를 배포한다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY (등록법은 docs/server.md)
on:
  push:
    branches: [ "main", "moa" ]
    paths: [ "server/**", ".github/workflows/server.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4

    - name: Skip when Cloudflare is not connected yet
      if: env.CF_TOKEN == ''
      run: echo "::notice::CLOUDFLARE_API_TOKEN이 없어 배포를 건너뜁니다. docs/server.md를 따라 Secrets를 등록하세요."

    - name: Deploy worker
      if: env.CF_TOKEN != ''
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: server
        wranglerVersion: "4.162.0"
        command: deploy
        secrets: |
          GEMINI_API_KEY
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # 배포한 서버가 실제로 대답하는지 한 번 물어본다. 실패해도 배포 자체는 성공으로 둔다.
    - name: Smoke test
      if: env.CF_TOKEN != ''
      continue-on-error: true
      run: |
        URL=https://moa-api.kimeujin03.workers.dev
        sleep 5
        echo "health: $(curl -sS -m 20 $URL/health)"
        ask() { echo "$1 => $(curl -sS -m 30 -w ' [%{http_code} %{time_total}s]' -X POST $URL/v1/parse -H 'content-type: application/json' -d "{\"text\":\"$1\",\"activities\":[\"공부\",\"과제\",\"이동\",\"알바\"],\"running\":[],\"now\":\"$2\",\"today\":\"$3\"}")"; }
        ask "도서관 가는 길인데 좀 졸려" "14:05" "2026-11-16 월"
        ask "다음주 화요일 3시에 교수님 면담 잡혔어" "14:05" "2026-11-16 월"
        ask "금요일 6시까지 레포트 내야 돼" "14:05" "2026-11-16 월"
        ask "주말 안에 빨래 돌려야 되는데" "14:05" "2026-11-16 월"
        ask "내일 아침 9시에 일어날거여" "01:16" "2026-11-17 화"
        ask "내일 공부를 2시간 해볼까" "01:16" "2026-11-17 화"

    # 어떤 모델이 빠른지 직접 잰다(키는 GitHub가 가린다). 문장 하나로 생각 설정 유무를 비교한다.
    - name: Model latency probe
      if: env.CF_TOKEN != ''
      continue-on-error: true
      env:
        KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        B=https://generativelanguage.googleapis.com/v1beta/models
        echo "models: $(curl -sS -m 20 "$B?pageSize=200" -H "x-goog-api-key: $KEY" | grep -o '"name": "models/gemini[^"]*flash[^"]*"' | sed 's/"name": "models\///;s/"//' | tr '\n' ' ')"
        BODY='{"contents":[{"role":"user","parts":[{"text":"내일 아침 9시에 일어날거여 를 JSON {\"date\":\"\",\"start\":\"\"} 로. 오늘은 2026-11-17."}]}],"generationConfig":{"temperature":0,"responseMimeType":"application/json"THINK}}'
        for M in gemini-3.5-flash-lite gemini-3-flash-lite gemini-2.5-flash-lite gemini-flash-lite-latest gemini-3.5-flash; do
          for T in "" ',"thinkingConfig":{"thinkingLevel":"minimal"}' ',"thinkingConfig":{"thinkingBudget":0}'; do
            D=${BODY/THINK/$T}
            R=$(curl -sS -m 30 -o /tmp/r.json -w '%{http_code} %{time_total}s' -X POST "$B/$M:generateContent" -H "x-goog-api-key: $KEY" -H 'content-type: application/json' -d "$D")
            echo "probe $M think=[${T:0:40}] => $R $(head -c 160 /tmp/r.json | tr '\n' ' ')"
          done
        done
